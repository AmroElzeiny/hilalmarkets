{% macro empty_state(title, message, icon='info', action_label=None, action_href=None) -%}
<div class="empty-state" role="status">
  <div class="icon-box"><span data-icon="{{ icon }}" data-icon-class="icon"></span></div>
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
  {% if action_label and action_href %}<a class="btn btn-secondary btn-sm" href="{{ action_href }}">{{ action_label }}</a>{% endif %}
</div>
{%- endmacro %}
