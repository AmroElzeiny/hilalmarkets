[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hm-chatbot-eval"
version = "1.0.0"
description = "Evidence-backed AI-vs-AI evaluator for the HilalMarkets AI Setup Chat and Strategy Canvas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
hm-chatbot-eval = "hm_chatbot_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hm_chatbot_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
