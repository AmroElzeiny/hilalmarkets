[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-market-monitor"
version = "0.1.0"
description = "Explainable crypto spot-market monitoring and decision support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "celery[redis]==5.6.3",
  "ccxt==4.5.58",
  "cryptography==49.0.0",
  "curl-cffi==0.15.0",
  "email-validator==2.3.0",
  "fastapi==0.137.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "markupsafe==3.0.2",
  "orjson==3.11.9",
  # A real browser, for the one job a plain HTTP request cannot do: reading a project's
  # blog or forum that only exists after its JavaScript has run. It is a runtime
  # dependency, not a development one, because `services/sharia_page_render.py` is part
  # of the Shariah source pipeline that runs on the server. It was listed under `dev`
  # alone until 1 September 2026, so the switch that turns rendering on had nothing to
  # turn on in production and every such page was reported as unreadable.
  #
  # Installing this package does **not** install Chromium — that is a separate download,
  # done in the runtime stage of the Dockerfile.
  "playwright==1.60.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.1",
  "pypdf==6.14.2",
  "python-multipart==0.0.32",
  "redis==5.3.1",
  "scrapling==0.4.11",
  "sqlalchemy==2.0.50",
  "structlog==25.5.0",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.1.0",
  "rich==14.0.0",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.3.0",
  "hypothesis==6.163.0",
  "ruff==0.15.17",
  "typer==0.16.0",
]
evaluator = [
  "rich==14.0.0",
  "typer==0.16.0",
]

# `playwright` is deliberately not repeated in either extra above. It moved into
# `dependencies` on 1 September 2026, and an extra always installs `dependencies` too, so
# a line here would be a second copy of the same pin — two places to edit for one version
# bump, and one of them eventually forgotten.

[project.scripts]
hm-chatbot-eval = "hm_chatbot_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_market_monitor", "src/hm_chatbot_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]
extend-exclude = ["HilalMarkets_Chatbot_AI_Evaluator"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/hm_chatbot_eval/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "celery", "celery.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
