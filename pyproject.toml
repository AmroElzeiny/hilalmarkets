[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-market-monitor"
version = "0.1.0"
description = "Explainable crypto spot-market monitoring and decision support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "celery[redis]==5.6.3",
  "ccxt==4.5.58",
  "cryptography==49.0.0",
  "email-validator==2.3.0",
  "fastapi==0.137.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.2",
  "orjson==3.11.9",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.1",
  "python-multipart==0.0.32",
  "redis==5.3.1",
  "scrapling==0.4.11",
  "sqlalchemy==2.0.50",
  "structlog==25.5.0",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.1.0",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.3.0",
  "playwright==1.60.0",
  "ruff==0.15.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_market_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "celery", "celery.*"]
ignore_missing_imports = true
