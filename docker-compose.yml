services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://market_monitor:market_monitor@db:5432/market_monitor
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn ai_market_monitor.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://market_monitor:market_monitor@db:5432/market_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app worker --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A ai_market_monitor.worker.app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 5

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://market_monitor:market_monitor@db:5432/market_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app beat --loglevel=INFO

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_monitor
      POSTGRES_USER: market_monitor
      POSTGRES_PASSWORD: market_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
