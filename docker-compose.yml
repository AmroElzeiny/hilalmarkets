# Deployment compose for HilalMarkets.
#
# Every service used to hardcode `DATABASE_URL` with the password `market_monitor` in its
# `environment:` block. That block wins over `env_file: .env`, so an operator who set a
# real password in `.env` was still deployed with the one published in this repository,
# and nothing said so.
#
# Secrets now come from the environment with `:?`, which stops `docker compose up` with a
# named error when one is missing rather than falling back to something insecure. Set them
# in `.env` next to this file — see `.env.production.example`.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, see .env.production.example}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VITE_ANALYTICS_ENABLED: "true"
      VITE_GTM_ID: "GTM-KBBHH2FV"
      VITE_GA4_MEASUREMENT_ID: ""
      MARKETING_CONSENT_ENABLED: "true"
      VITE_X_PIXEL_ENABLED: "true"
      VITE_X_PIXEL_ID: "re20l"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn ai_market_monitor.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, see .env.production.example}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VITE_ANALYTICS_ENABLED: "true"
      VITE_GTM_ID: "GTM-KBBHH2FV"
      VITE_GA4_MEASUREMENT_ID: ""
      MARKETING_CONSENT_ENABLED: "true"
      VITE_X_PIXEL_ENABLED: "true"
      VITE_X_PIXEL_ID: "re20l"
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app worker --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A ai_market_monitor.worker.app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 5

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, see .env.production.example}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VITE_ANALYTICS_ENABLED: "true"
      VITE_GTM_ID: "GTM-KBBHH2FV"
      VITE_GA4_MEASUREMENT_ID: ""
      MARKETING_CONSENT_ENABLED: "true"
      VITE_X_PIXEL_ENABLED: "true"
      VITE_X_PIXEL_ID: "re20l"
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `--schedule` points at a volume on purpose. Celery beat remembers when each task
    # last ran in this file, and a task whose interval is a day only fires a day after
    # beat *started*. The file used to sit in the container's own writable layer, so
    # every rebuild recreated it and every daily task began its countdown again — the
    # nightly scan-history cleanup had effectively never run.
    command: >-
      celery -A ai_market_monitor.worker.app beat --loglevel=INFO
      --schedule /app/beat/celerybeat-schedule
    volumes:
      - beat_schedule:/app/beat

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hilalmarkets}
      POSTGRES_USER: ${POSTGRES_USER:-hilalmarkets}
      # No default. A database whose password is printed in a public repository is not
      # protected by anything, so there is no safe value to fall back to.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env to a strong secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hilalmarkets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?set POSTGRES_VOLUME_NAME to the authoritative PostgreSQL volume}
  #: When each scheduled task last ran. See the `--schedule` note on `scheduler` above.
  beat_schedule:
