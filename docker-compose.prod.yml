x-tracedge-env: &tracedge_env
  - ${TRACEDGE_ENV_FILE:-.env.production}

# Docker's json-file driver never rotates on its own: a container's log grows until the
# disk is full. The scanner writes a line per provider call, so a busy day across an
# approved universe is the workload most able to fill it, and a full disk stops
# PostgreSQL writing - which turns a logging default into an outage. Every service caps
# and rotates, so the worst case is bounded at max-size x max-file per container.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Every service has a memory ceiling, and the ceilings add up to less than the server has.
#
# Without them, one container can take the whole machine down, and on 22 August 2026 one
# did. The kernel log:
#
#   Out of memory: Killed process 564376 (celery) anon-rss:1428256kB   15:48:53
#   Out of memory: Killed process 597555 (celery) anon-rss:1428884kB   16:50:20
#   systemd invoked oom-killer                                        16:50:19
#   Total swap = 0kB, 1023866 pages RAM (about 3.9 GB)
#
# A Celery worker grew to 1.4 GB. With no limit, the kernel had to choose a victim across
# the whole machine, and it eventually chose systemd — process 1. The site went down, SSH
# stopped accepting connections, and the server could only be reached through Hetzner's
# rescue system.
#
# With a limit, the kernel kills only the container that broke its own promise. Docker
# restarts it, and PostgreSQL, Redis, Caddy and the API never notice.
#
# The budget below is for the Hetzner CX22 this runs on: 2 CPUs, 3.9 GB RAM, 40 GB disk.
#
#   api 1024m + worker 768m + db 640m + scheduler 256m + redis 192m + caddy 128m
#     = 3008m, leaving about 780 MB for the operating system and the page cache.
#
# The shares are set from what each service actually uses, measured on the live server on
# 22 August 2026, not from guessing:
#
#   api 273m   db 113m   worker 465m   scheduler 57m   caddy 43m   redis 27m
#
# The first version of this budget gave the api 768m and the worker 1024m. That was
# backwards. The api is the customer-facing process — when it dies the website is down —
# and it was the one being killed (`uvicorn` at 694 MB, 17:57). Meanwhile db sat at 113 MB
# of its 768, and the scheduler at 57 MB of its 384. The room existed; it was in the wrong
# place. The api now has the largest share, and the total came *down*.
#
# Changing the server size means changing these together. They are deliberately written
# out per service rather than shared through one anchor: they are not the same number and
# an anchor would invite making them so.

# Public analytics identifiers are pinned here so a stale secret file cannot
# re-enable the retired direct-GA integration in a production container.
x-public-analytics-env: &public_analytics_env
  VITE_ANALYTICS_ENABLED: "true"
  VITE_GTM_ID: "GTM-KBBHH2FV"
  VITE_GA4_MEASUREMENT_ID: ""
  MARKETING_CONSENT_ENABLED: "true"
  VITE_X_PIXEL_ENABLED: "true"
  VITE_X_PIXEL_ID: "re20l"

services:
  caddy:
    logging: *default_logging
    mem_limit: 128m
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 runs over QUIC, which is UDP. Caddy listens for it and advertises it in
      # every response, but without this line the packets never reach the container, so
      # each browser tries QUIC, waits for a reply that cannot arrive, and falls back to
      # TCP. Publishing the port is what makes the advertisement true.
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    logging: *default_logging
    # The largest share, because this is the one a customer notices. It was killed at
    # 694 MB against a 768 MB ceiling on 22 August 2026.
    mem_limit: 1024m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn ai_market_monitor.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - exports_data:/app/exports

  worker:
    logging: *default_logging
    # Its own Celery limits (core/config.py) recycle a child that grows between tasks;
    # this is the hard stop for a single task that allocates too much in one go. One
    # child at 350 MB plus a 200 MB parent is 550 MB, so 768m leaves real headroom.
    mem_limit: 768m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app worker --loglevel=INFO
    volumes:
      - exports_data:/app/exports

  scheduler:
    logging: *default_logging
    # Beat only enqueues work; measured at 57 MB. Its small, stable size is also the proof
    # that the growth elsewhere comes from doing work, not from loading the application.
    mem_limit: 256m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `--schedule` points at a volume on purpose. Celery beat remembers when each task
    # last ran in this file, and a task whose interval is a day only fires a day after
    # beat *started*. The file used to sit in the container's own writable layer, so
    # every deploy recreated it and every daily task began its countdown again. This
    # project deploys far more often than once a day, so the nightly tasks — scan
    # history cleanup among them — had effectively never run: two-month-old scan jobs
    # were still in the database under a thirty-day retention rule.
    command: >-
      celery -A ai_market_monitor.worker.app beat --loglevel=INFO
      --schedule /app/beat/celerybeat-schedule
    volumes:
      - exports_data:/app/exports
      - beat_schedule:/app/beat

  db:
    logging: *default_logging
    # Measured at 113 MB. PostgreSQL's default shared_buffers is 128 MB, so 640m is still
    # several times what it asks for.
    mem_limit: 640m
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *default_logging
    # Measured at 27 MB holding a 69 MB dataset on disk.
    mem_limit: 192m
    image: redis:7-alpine
    restart: unless-stopped
    # `--maxmemory` is deliberately NOT set. Redis is the Celery broker here, so evicting
    # keys under pressure would silently drop queued background jobs. The container limit
    # above is the ceiling; if Redis ever reaches it, the answer is a bigger limit or less
    # queued work, never eviction.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME in .env.production}
  redis_data:
  exports_data:
  #: When each scheduled task last ran. See the `--schedule` note on `scheduler` above.
  beat_schedule:
