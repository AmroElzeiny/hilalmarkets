x-tracedge-env: &tracedge_env
  - ${TRACEDGE_ENV_FILE:-.env.production}

# Public analytics identifiers are pinned here so a stale secret file cannot
# re-enable the retired direct-GA integration in a production container.
x-public-analytics-env: &public_analytics_env
  VITE_ANALYTICS_ENABLED: "true"
  VITE_GTM_ID: "GTM-KBBHH2FV"
  VITE_GA4_MEASUREMENT_ID: ""

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn ai_market_monitor.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - exports_data:/app/exports

  worker:
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app worker --loglevel=INFO
    volumes:
      - exports_data:/app/exports

  scheduler:
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app beat --loglevel=INFO
    volumes:
      - exports_data:/app/exports

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  exports_data:
