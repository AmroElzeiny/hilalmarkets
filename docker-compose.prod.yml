x-tracedge-env: &tracedge_env
  - ${TRACEDGE_ENV_FILE:-.env.production}

# Docker's json-file driver never rotates on its own: a container's log grows until the
# disk is full. The scanner writes a line per provider call, so a busy day across an
# approved universe is the workload most able to fill it, and a full disk stops
# PostgreSQL writing - which turns a logging default into an outage. Every service caps
# and rotates, so the worst case is bounded at max-size x max-file per container.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Every service has a memory ceiling, and the ceilings add up to less than the server has.
#
# Without them, one container can take the whole machine down, and on 22 August 2026 one
# did. The kernel log:
#
#   Out of memory: Killed process 564376 (celery) anon-rss:1428256kB   15:48:53
#   Out of memory: Killed process 597555 (celery) anon-rss:1428884kB   16:50:20
#   systemd invoked oom-killer                                        16:50:19
#   Total swap = 0kB, 1023866 pages RAM (about 3.9 GB)
#
# A Celery worker grew to 1.4 GB. With no limit, the kernel had to choose a victim across
# the whole machine, and it eventually chose systemd — process 1. The site went down, SSH
# stopped accepting connections, and the server could only be reached through Hetzner's
# rescue system.
#
# With a limit, the kernel kills only the container that broke its own promise. Docker
# restarts it, and PostgreSQL, Redis, Caddy and the API never notice.
#
# The budget below is for the Hetzner CX22 this runs on: 2 CPUs, 3.9 GB RAM, 40 GB disk.
#
#   api 1280m + worker 768m + db 512m + scheduler 192m + redis 160m + caddy 128m
#     = 3040m, leaving about 750 MB for the operating system and the page cache.
#
# The api's share grew again when it went from one worker process to two. Two workers at
# the measured 273 MB each, plus the small parent that supervises them, is about 630 MB
# before any growth at all — and the whole point of the ceiling is to be reached only by
# something abnormal, never by normal running.
#
# The shares are set from what each service actually uses, measured on the live server on
# 22 August 2026, not from guessing:
#
#   api 273m   db 113m   worker 465m   scheduler 57m   caddy 43m   redis 27m
#
# The first version of this budget gave the api 768m and the worker 1024m. That was
# backwards. The api is the customer-facing process — when it dies the website is down —
# and it was the one being killed (`uvicorn` at 694 MB, 17:57). Meanwhile db sat at 113 MB
# of its 768, and the scheduler at 57 MB of its 384. The room existed; it was in the wrong
# place. The api now has the largest share, and the total came *down*.
#
# Changing the server size means changing these together. They are deliberately written
# out per service rather than shared through one anchor: they are not the same number and
# an anchor would invite making them so.

# Public analytics identifiers are pinned here so a stale secret file cannot
# re-enable the retired direct-GA integration in a production container.
x-public-analytics-env: &public_analytics_env
  VITE_ANALYTICS_ENABLED: "true"
  VITE_GTM_ID: "GTM-KBBHH2FV"
  VITE_GA4_MEASUREMENT_ID: ""
  MARKETING_CONSENT_ENABLED: "true"
  VITE_X_PIXEL_ENABLED: "true"
  VITE_X_PIXEL_ID: "re20l"

services:
  caddy:
    logging: *default_logging
    mem_limit: 128m
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 runs over QUIC, which is UDP. Caddy listens for it and advertises it in
      # every response, but without this line the packets never reach the container, so
      # each browser tries QUIC, waits for a reply that cannot arrive, and falls back to
      # TCP. Publishing the port is what makes the advertisement true.
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    logging: *default_logging
    # It was killed at 694 MB against a 768 MB ceiling on 22 August 2026, when it ran as a
    # single process, and this became the largest share on the machine in response.
    #
    # It is no longer the largest share, because the reason it needed one is gone. That
    # 694 MB was a page reading a month of scan rows to count them; a page now counts in
    # SQL and the container was measured at 367 MB of 1280 on 24 August 2026. The 320 MB
    # given up here goes to the database, which was the one actually short of room.
    #
    # The floor is not arbitrary: `test_invariant_container_memory_limits.py` requires two
    # workers plus a parent to fit inside three quarters of this number.
    mem_limit: 960m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `serve` runs several workers and retires each one after a bounded number of
    # requests, so the website stays up while a process is replaced and no process lives
    # long enough to grow into the ceiling above. The numbers are settings, read by
    # `ai_market_monitor/serve.py` — deliberately not repeated here, because a second copy
    # of a number is a number that drifts.
    #
    # The migration runs once, in this shell, before any worker starts. Running it inside
    # the workers would run it as many times as there are workers.
    command: >
      sh -c "alembic upgrade head &&
      python -m ai_market_monitor.serve"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - exports_data:/app/exports

  worker:
    logging: *default_logging
    # Its own Celery limits (core/config.py) recycle a child that grows between tasks;
    # this is the hard stop for a single task that allocates too much in one go.
    #
    # 768m was too tight and the worker was killed at about 700 MB on 22 August 2026,
    # mid-task. Celery's per-child memory limit cannot prevent that: it is checked
    # *between* tasks, so one scan that allocates a lot in a single run walks straight
    # past it. A scan holds the exchange's whole market list — measured at 139 MB — for
    # the length of the run, on top of the 350 MB recycle threshold and a 200 MB parent.
    mem_limit: 1024m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A ai_market_monitor.worker.app worker --loglevel=INFO
    volumes:
      - exports_data:/app/exports

  scheduler:
    logging: *default_logging
    # Beat only enqueues work; measured at 57 MB. Its small, stable size is also the proof
    # that the growth elsewhere comes from doing work, not from loading the application.
    mem_limit: 192m
    build: .
    restart: unless-stopped
    env_file: *tracedge_env
    environment: *public_analytics_env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `--schedule` points at a volume on purpose. Celery beat remembers when each task
    # last ran in this file, and a task whose interval is a day only fires a day after
    # beat *started*. The file used to sit in the container's own writable layer, so
    # every deploy recreated it and every daily task began its countdown again. This
    # project deploys far more often than once a day, so the nightly tasks — scan
    # history cleanup among them — had effectively never run: two-month-old scan jobs
    # were still in the database under a thirty-day retention rule.
    command: >-
      celery -A ai_market_monitor.worker.app beat --loglevel=INFO
      --schedule /app/beat/celerybeat-schedule
    volumes:
      - exports_data:/app/exports
      - beat_schedule:/app/beat

  db:
    logging: *default_logging
    # 512m was measured when this database held 113 MB. On 24 August 2026 it was sitting at
    # 476 MB of that 512 — 93% — and the data had not finished growing: `scan_results` was
    # 549 MB holding only 7.6 days of a 30-day window, so the table alone is heading for
    # about 2 GB at today's rate and three times that at the 50 monitors this is being
    # sized for.
    #
    # A database container's memory is not just its own working set. Everything above
    # `shared_buffers` is page cache holding the hot parts of the tables and indexes, and
    # when that cache is too small every count goes back to the disk. Squeezing it was
    # false economy: the room came from the api, which was using 367 MB of 1280.
    mem_limit: 960m
    image: postgres:16-alpine
    restart: unless-stopped
    # PostgreSQL's own defaults are sized for a much smaller container than this one, and
    # they do not read the container's limit. `shared_buffers` is a quarter of the ceiling,
    # the standard starting point; `effective_cache_size` is not an allocation but a hint,
    # telling the planner how much cache it may assume when it chooses between an index and
    # a table scan.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *default_logging
    # Measured at 27 MB holding a 69 MB dataset on disk.
    mem_limit: 160m
    image: redis:7-alpine
    restart: unless-stopped
    # `--maxmemory` is deliberately NOT set. Redis is the Celery broker here, so evicting
    # keys under pressure would silently drop queued background jobs. The container limit
    # above is the ceiling; if Redis ever reaches it, the answer is a bigger limit or less
    # queued work, never eviction.
    #
    # The shared market cache (`services/market_cache.py`) also lives in here, under the
    # `hm:mkt:` prefix. Because eviction is not available, that cache has to bound itself
    # instead, and does so two ways: every entry expires within a minute, and any single
    # reading over 256 KB is answered but not stored. Expected footprint is single-figure
    # megabytes — a few hundred readings of about 24 KB, each living one minute.
    #
    # If Redis memory ever climbs here, look at that prefix first: `redis-cli --scan
    # --pattern 'hm:mkt:*' | wc -l` counts them, and turning MARKET_CACHE_ENABLED off
    # removes them all within a minute without a deploy.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME in .env.production}
  redis_data:
  exports_data:
  #: When each scheduled task last ran. See the `--schedule` note on `scheduler` above.
  beat_schedule:
