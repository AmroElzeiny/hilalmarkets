name: Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  APP_ENV: test
  APP_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-characters
  DATABASE_URL: postgresql+asyncpg://market_monitor:market_monitor@localhost:5432/market_monitor
  REDIS_URL: redis://localhost:6379/0
  PUBLIC_BASE_URL: http://127.0.0.1:8000
  AI_INTERPRETER_PROVIDER: rules
  EMAIL_ADAPTER: memory
  SCANNING_ENABLED: "false"
  TELEGRAM_ENABLED: "false"
  WHATSAPP_ENABLED: "false"
  WHATSAPP_OPPORTUNITY_ALERTS_ENABLED: "false"
  BILLING_ENABLED: "false"
  AI_AGENT_CONTROL_ENABLED: "true"
  AI_AGENT_SHADOW_MODE: "true"
  AI_AGENT_ROLLOUT_PERCENT: "0"
  CAPABILITY_EXTENSION_ENABLED: "false"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_monitor
          POSTGRES_USER: market_monitor
          POSTGRES_PASSWORD: market_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate dependency pins and installation
        run: |
          python scripts/check_dependency_lock.py
          python -m pip check
      - name: Validate one Alembic head and upgrade from previous revision
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade 09bac1d2e3f4
          alembic upgrade head
      - run: ruff check .
      - run: mypy src/ai_market_monitor
      - run: python scripts/check_api_route_security.py
      - run: python scripts/check_release_invariants.py
      - run: python scripts/check_jinja_templates.py
      - run: python scripts/check_javascript.py
      - name: Full backend test suite
        run: pytest --ignore=tests/browser --junitxml=reports/backend-results.xml
      - name: Verify tests did not modify tracked artifacts
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: reports/backend-results.xml
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Chromium desktop and mobile smoke suite
        run: pytest tests/browser --junitxml=reports/playwright/playwright-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            reports/playwright
            test-results/browser
            playwright-report
            PLAYWRIGHT_E2E_REPORT.md
          if-no-files-found: ignore

  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t hilalmarkets:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: hilalmarkets:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
